name: Build & Fortify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: >
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.22.1

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libzip-dev

      - name: Cache prebuilt native libs
        id: cache-prebuilt
        uses: actions/cache@v4
        with:
          path: prebuilt
          key: ${{ runner.os }}-prebuilt-ndk29-openssl3-libzip1.10-v4

      - name: Build OpenSSL for Android
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: |
          set -e
          mkdir -p prebuilt

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_BIN" ]; then
            echo "NDK toolchain not found at $NDK_BIN"
            find "$ANDROID_NDK_HOME" -maxdepth 3 -type d | head -20
            exit 1
          fi

          # ============================================================
          # 根治：自动探测 NDK 中实际的 clang 文件名（不硬编码 API 级别）
          # NDK r29 的文件名是 aarch64-linux-android21-clang，不是 28
          # ============================================================
          echo ">>> NDK bin directory contents (aarch64/arm):"
          ls -1 "$NDK_BIN" | grep -E '^(aarch64|arm)' | head -20

          # 自动探测 arm64 clang
          AARCH64_GCC=$(ls -1 "$NDK_BIN" | grep -E '^aarch64-linux-android[0-9]+-clang$' | head -1)
          AARCH64_GXX=$(ls -1 "$NDK_BIN" | grep -E '^aarch64-linux-android[0-9]+-clang\+\+$' | head -1)
          # 自动探测 armv7 clang
          ARM_GCC=$(ls -1 "$NDK_BIN" | grep -E '^armv7a-linux-androideabi[0-9]+-clang$' | head -1)
          ARM_GXX=$(ls -1 "$NDK_BIN" | grep -E '^armv7a-linux-androideabi[0-9]+-clang\+\+$' | head -1)

          # 校验是否找到
          if [ -z "$AARCH64_GCC" ] || [ -z "$AARCH64_GXX" ]; then
            echo "Failed to find aarch64 clang in NDK"
            ls -la "$NDK_BIN"
            exit 1
          fi
          if [ -z "$ARM_GCC" ] || [ -z "$ARM_GXX" ]; then
            echo "Failed to find armv7 clang in NDK"
            ls -la "$NDK_BIN"
            exit 1
          fi

          echo ">>> Found compilers:"
          echo "  arm64:  $AARCH64_GCC / $AARCH64_GXX"
          echo "  armv7:  $ARM_GCC / $ARM_GXX"

          # 创建符号链接，让 OpenSSL Configure 脚本"以为"找到了 gcc
          mkdir -p "$GITHUB_WORKSPACE/ndk-symlinks"
          cd "$GITHUB_WORKSPACE/ndk-symlinks"

          ln -sf "$NDK_BIN/$AARCH64_GCC" aarch64-linux-android-gcc
          ln -sf "$NDK_BIN/$AARCH64_GXX" aarch64-linux-android-g++
          ln -sf "$NDK_BIN/llvm-ar" aarch64-linux-android-ar
          ln -sf "$NDK_BIN/llvm-nm" aarch64-linux-android-nm
          ln -sf "$NDK_BIN/llvm-ranlib" aarch64-linux-android-ranlib
          ln -sf "$NDK_BIN/llvm-strip" aarch64-linux-android-strip

          ln -sf "$NDK_BIN/$ARM_GCC" arm-linux-androideabi-gcc
          ln -sf "$NDK_BIN/$ARM_GXX" arm-linux-androideabi-g++
          ln -sf "$NDK_BIN/llvm-ar" arm-linux-androideabi-ar
          ln -sf "$NDK_BIN/llvm-nm" arm-linux-androideabi-nm
          ln -sf "$NDK_BIN/llvm-ranlib" arm-linux-androideabi-ranlib
          ln -sf "$NDK_BIN/llvm-strip" arm-linux-androideabi-strip

          cd "$GITHUB_WORKSPACE"
          export PATH="$GITHUB_WORKSPACE/ndk-symlinks:$NDK_BIN:$PATH"

          wget -q https://www.openssl.org/source/openssl-3.0.13.tar.gz
          tar xzf openssl-3.0.13.tar.gz
          cd openssl-3.0.13

          # 编译 arm64-v8a
          echo ">>> Configuring OpenSSL for arm64-v8a"
          ./Configure android-arm64 \
            -D__ANDROID_API__=28 \
            --prefix="$GITHUB_WORKSPACE/prebuilt/openssl/arm64-v8a" \
            --openssldir="$GITHUB_WORKSPACE/prebuilt/openssl/arm64-v8a" \
            no-shared no-tests
          echo ">>> Building OpenSSL for arm64-v8a"
          make -j$(nproc)
          echo ">>> Installing OpenSSL for arm64-v8a"
          make install_sw
          make distclean || true

          # 编译 armeabi-v7a
          echo ">>> Configuring OpenSSL for armeabi-v7a"
          ./Configure android-arm \
            -D__ANDROID_API__=28 \
            --prefix="$GITHUB_WORKSPACE/prebuilt/openssl/armeabi-v7a" \
            --openssldir="$GITHUB_WORKSPACE/prebuilt/openssl/armeabi-v7a" \
            no-shared no-tests
          echo ">>> Building OpenSSL for armeabi-v7a"
          make -j$(nproc)
          echo ">>> Installing OpenSSL for armeabi-v7a"
          make install_sw

          cd ..

      - name: Build libzip for Android
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: |
          set -e

          wget -q https://libzip.org/download/libzip-1.10.1.tar.xz
          tar xf libzip-1.10.1.tar.xz
          cd libzip-1.10.1

          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "build-$ABI" && cd "build-$ABI"
            cmake .. \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/prebuilt/libzip/$ABI" \
              -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/prebuilt/openssl/$ABI" \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_BZIP2=OFF \
              -DENABLE_LZMA=OFF \
              -DENABLE_ZSTD=OFF \
              -DCMAKE_BUILD_TYPE=Release
            make -j$(nproc)
            make install
            cd ..
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          OPENSSL_BASE_DIR: ${{ github.workspace }}/prebuilt/openssl
          LIBZIP_BASE_DIR: ${{ github.workspace }}/prebuilt/libzip

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fortified-apk
          path: app/build/outputs/apk/release/*-signed.apk

      - name: Upload Golden Hash
        uses: actions/upload-artifact@v4
        with:
          name: golden-hash
          path: app/build/outputs/security/
