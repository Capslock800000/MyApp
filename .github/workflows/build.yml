name: Build & Fortify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: >
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.22.1

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libzip-dev

      - name: Cache prebuilt native libs
        id: cache-prebuilt
        uses: actions/cache@v4
        with:
          path: prebuilt
          key: ${{ runner.os }}-prebuilt-ndk29-openssl3-libzip1.10-v9

      - name: Build OpenSSL & libzip for Android
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: |
          set -e
          mkdir -p prebuilt

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_BIN" ]; then
            echo "NDK toolchain not found at $NDK_BIN"
            find "$ANDROID_NDK_HOME" -maxdepth 3 -type d | head -20
            exit 1
          fi

          echo ">>> NDK bin directory contents:"
          ls -1 "$NDK_BIN" | grep -E '^(aarch64|armv7a|llvm)' | head -30

          # ============================================================
          # 自动探测实际文件名（不硬编码 API 级别）
          # ============================================================
          AARCH64_CLANG=$(ls -1 "$NDK_BIN" | grep -E '^aarch64-linux-android[0-9]+-clang$' | sort | head -1)
          AARCH64_CLANGXX=$(ls -1 "$NDK_BIN" | grep -E '^aarch64-linux-android[0-9]+-clang\+\+$' | sort | head -1)
          ARM_CLANG=$(ls -1 "$NDK_BIN" | grep -E '^armv7a-linux-androideabi[0-9]+-clang$' | sort | head -1)
          ARM_CLANGXX=$(ls -1 "$NDK_BIN" | grep -E '^armv7a-linux-androideabi[0-9]+-clang\+\+$' | sort | head -1)

          if [ -z "$AARCH64_CLANG" ] || [ -z "$AARCH64_CLANGXX" ]; then
            echo "Failed to find aarch64 clang in NDK"
            ls -la "$NDK_BIN"
            exit 1
          fi
          if [ -z "$ARM_CLANG" ] || [ -z "$ARM_CLANGXX" ]; then
            echo "Failed to find armv7 clang in NDK"
            ls -la "$NDK_BIN"
            exit 1
          fi

          echo ">>> Found compilers:"
          echo "  arm64:  $AARCH64_CLANG / $AARCH64_CLANGXX"
          echo "  armv7:  $ARM_CLANG / $ARM_CLANGXX"

          # 创建统一兼容工具目录
          COMPAT_BIN="$GITHUB_WORKSPACE/compat-bin"
          mkdir -p "$COMPAT_BIN"

          # ============================================================
          # 兼容方案1: NDK bin 目录内符号链接
          # OpenSSL Configure 优先在 PATH 中查找 aarch64-linux-android-gcc
          # ============================================================
          echo ">>> 方案1: NDK bin 内符号链接"
          cd "$NDK_BIN"
          ln -sfn "$AARCH64_CLANG"  aarch64-linux-android-clang
          ln -sfn "$AARCH64_CLANGXX" aarch64-linux-android-clang++
          ln -sfn "$AARCH64_CLANG"  aarch64-linux-android-gcc
          ln -sfn "$AARCH64_CLANGXX" aarch64-linux-android-g++
          ln -sfn llvm-ar            aarch64-linux-android-ar
          ln -sfn llvm-ranlib        aarch64-linux-android-ranlib
          ln -sfn llvm-strip         aarch64-linux-android-strip

          ln -sfn "$ARM_CLANG"  arm-linux-androideabi-clang
          ln -sfn "$ARM_CLANGXX" arm-linux-androideabi-clang++
          ln -sfn "$ARM_CLANG"  arm-linux-androideabi-gcc
          ln -sfn "$ARM_CLANGXX" arm-linux-androideabi-g++
          ln -sfn llvm-ar       arm-linux-androideabi-ar
          ln -sfn llvm-ranlib   arm-linux-androideabi-ranlib
          ln -sfn llvm-strip    arm-linux-androideabi-strip
          cd "$GITHUB_WORKSPACE"

          # ============================================================
          # 兼容方案2: 本地硬拷贝（避免符号链接在特定文件系统/容器下失效）
          # ============================================================
          echo ">>> 方案2: 本地硬拷贝"
          cp -L "$NDK_BIN/$AARCH64_CLANG" "$COMPAT_BIN/aarch64-linux-android-clang"
          cp -L "$NDK_BIN/$AARCH64_CLANGXX" "$COMPAT_BIN/aarch64-linux-android-clang++"
          cp -L "$NDK_BIN/$AARCH64_CLANG" "$COMPAT_BIN/aarch64-linux-android-gcc"
          cp -L "$NDK_BIN/$AARCH64_CLANGXX" "$COMPAT_BIN/aarch64-linux-android-g++"
          cp -L "$NDK_BIN/llvm-ar" "$COMPAT_BIN/aarch64-linux-android-ar"
          cp -L "$NDK_BIN/llvm-ranlib" "$COMPAT_BIN/aarch64-linux-android-ranlib"

          cp -L "$NDK_BIN/$ARM_CLANG" "$COMPAT_BIN/arm-linux-androideabi-clang"
          cp -L "$NDK_BIN/$ARM_CLANGXX" "$COMPAT_BIN/arm-linux-androideabi-clang++"
          cp -L "$NDK_BIN/$ARM_CLANG" "$COMPAT_BIN/arm-linux-androideabi-gcc"
          cp -L "$NDK_BIN/$ARM_CLANGXX" "$COMPAT_BIN/arm-linux-androideabi-g++"
          cp -L "$NDK_BIN/llvm-ar" "$COMPAT_BIN/arm-linux-androideabi-ar"
          cp -L "$NDK_BIN/llvm-ranlib" "$COMPAT_BIN/arm-linux-androideabi-ranlib"
          chmod -R +x "$COMPAT_BIN"

          # ============================================================
          # 兼容方案3: Fake Wrapper（修复原始变量未展开 bug）
          # 原始脚本使用 <<'WRAPPER' 导致 ${NDK_BIN} 原样写入文件
          # 修复: 使用 printf 确保变量在写入前已展开
          # ============================================================
          echo ">>> 方案3: Fake Wrapper（变量已正确展开）"
          printf '#!/bin/bash\nexec %s "$@"\n' "$NDK_BIN/$AARCH64_CLANG" > "$COMPAT_BIN/wrapper-aarch64-gcc"
          printf '#!/bin/bash\nexec %s "$@"\n' "$NDK_BIN/$AARCH64_CLANGXX" > "$COMPAT_BIN/wrapper-aarch64-g++"
          printf '#!/bin/bash\nexec %s "$@"\n' "$NDK_BIN/$ARM_CLANG" > "$COMPAT_BIN/wrapper-arm-gcc"
          printf '#!/bin/bash\nexec %s "$@"\n' "$NDK_BIN/$ARM_CLANGXX" > "$COMPAT_BIN/wrapper-arm-g++"
          chmod +x "$COMPAT_BIN"/wrapper-*

          # ============================================================
          # 兼容方案4: 环境变量覆盖
          # 在 make 阶段强制使用指定编译器；Configure 阶段配合 PATH 使用
          # ============================================================
          echo ">>> 方案4: 环境变量"
          export CC_AARCH64="$NDK_BIN/$AARCH64_CLANG"
          export CXX_AARCH64="$NDK_BIN/$AARCH64_CLANGXX"
          export CC_ARM="$NDK_BIN/$ARM_CLANG"
          export CXX_ARM="$NDK_BIN/$ARM_CLANGXX"
          export AR="$NDK_BIN/llvm-ar"
          export RANLIB="$NDK_BIN/llvm-ranlib"

          # ============================================================
          # 兼容方案5: CROSS_COMPILE 前缀 + 统一 PATH
          # ============================================================
          echo ">>> 方案5: CROSS_COMPILE"
          export CROSS_COMPILE_AARCH64="aarch64-linux-android-"
          export CROSS_COMPILE_ARM="arm-linux-androideabi-"

          # ============================================================
          # 兼容方案6: PATH 优先级（compat-bin 置于最前）
          # 确保 OpenSSL Configure 的 which() 优先找到我们的工具
          # ============================================================
          echo ">>> 方案6: PATH 优先级"
          export PATH="$COMPAT_BIN:$NDK_BIN:$PATH"

          echo ">>> Verifying tools in PATH:"
          which aarch64-linux-android-gcc || echo "  gcc not found in PATH"
          which aarch64-linux-android-clang || echo "  clang not found in PATH"
          aarch64-linux-android-gcc --version 2>/dev/null || echo "  gcc version check failed"

          # ============================================================
          # 兼容方案7: Configure 命令行直接注入编译器路径
          # 显式传入 CC/CXX/AR/RANLIB，覆盖 OpenSSL 默认探测
          # ============================================================

          cd "$GITHUB_WORKSPACE"

          # ============================================================
          # 编译 OpenSSL 3.0.13
          # ============================================================
          wget -q https://www.openssl.org/source/openssl-3.0.13.tar.gz
          tar xzf openssl-3.0.13.tar.gz
          cd openssl-3.0.13

          # arm64-v8a
          echo ">>> Configuring OpenSSL for arm64-v8a"
          export CC="$CC_AARCH64"
          export CXX="$CXX_AARCH64"
          export CROSS_COMPILE="$CROSS_COMPILE_AARCH64"
          ./Configure android-arm64 \
            -D__ANDROID_API__=28 \
            --prefix="$GITHUB_WORKSPACE/prebuilt/openssl/arm64-v8a" \
            --openssldir="$GITHUB_WORKSPACE/prebuilt/openssl/arm64-v8a" \
            --cross-compile-prefix=aarch64-linux-android- \
            CC="$CC_AARCH64" \
            CXX="$CXX_AARCH64" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            no-shared no-tests
          echo ">>> Building OpenSSL for arm64-v8a"
          make -j$(nproc)
          echo ">>> Installing OpenSSL for arm64-v8a"
          make install_sw
          make distclean || true

          # armeabi-v7a
          echo ">>> Configuring OpenSSL for armeabi-v7a"
          export CC="$CC_ARM"
          export CXX="$CXX_ARM"
          export CROSS_COMPILE="$CROSS_COMPILE_ARM"
          ./Configure android-arm \
            -D__ANDROID_API__=28 \
            --prefix="$GITHUB_WORKSPACE/prebuilt/openssl/armeabi-v7a" \
            --openssldir="$GITHUB_WORKSPACE/prebuilt/openssl/armeabi-v7a" \
            --cross-compile-prefix=arm-linux-androideabi- \
            CC="$CC_ARM" \
            CXX="$CXX_ARM" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            no-shared no-tests
          echo ">>> Building OpenSSL for armeabi-v7a"
          make -j$(nproc)
          echo ">>> Installing OpenSSL for armeabi-v7a"
          make install_sw

          cd "$GITHUB_WORKSPACE"

          # ============================================================
          # 兼容方案8: 使用 linux-generic64 / linux-armv4 目标作为终极 Fallback
          # 如果 android 目标因 Configure 探测逻辑始终失败，回退到通用 Linux 目标
          # 注意：此方案仅在上述方案全部失效时手动启用
          # ============================================================
          # 以下注释展示了 fallback 用法（当前未启用）：
          # ./Configure linux-aarch64 -D__ANDROID_API__=28 ... CC="$CC_AARCH64" ...
          # ./Configure linux-armv4  -D__ANDROID_API__=28 ... CC="$CC_ARM" ...

          # ============================================================
          # 编译 libzip 1.10.1
          # ============================================================
          wget -q https://libzip.org/download/libzip-1.10.1.tar.xz
          tar xf libzip-1.10.1.tar.xz
          cd libzip-1.10.1

          for ABI in arm64-v8a armeabi-v7a; do
            BUILD_DIR="build-$ABI"
            INSTALL_DIR="$GITHUB_WORKSPACE/prebuilt/libzip/$ABI"
            OPENSSL_DIR="$GITHUB_WORKSPACE/prebuilt/openssl/$ABI"

            echo ">>> Configuring libzip for $ABI"
            cmake -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_static \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_OPENSSL=ON \
              -DOPENSSL_ROOT_DIR="$OPENSSL_DIR" \
              -DOPENSSL_INCLUDE_DIR="$OPENSSL_DIR/include" \
              -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_DIR/lib/libcrypto.a" \
              -DOPENSSL_SSL_LIBRARY="$OPENSSL_DIR/lib/libssl.a" \
              -DENABLE_BZIP2=OFF \
              -DENABLE_LZMA=OFF \
              -DENABLE_ZSTD=OFF

            echo ">>> Building libzip for $ABI"
            cmake --build "$BUILD_DIR" --config Release -j$(nproc)
            echo ">>> Installing libzip for $ABI"
            cmake --install "$BUILD_DIR"
          done

          cd "$GITHUB_WORKSPACE"
          echo ">>> All prebuilt artifacts:"
          find prebuilt -type f | sort

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          OPENSSL_BASE_DIR: ${{ github.workspace }}/prebuilt/openssl
          LIBZIP_BASE_DIR: ${{ github.workspace }}/prebuilt/libzip

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fortified-apk
          path: app/build/outputs/apk/release/*-signed.apk

      - name: Upload Golden Hash
        uses: actions/upload-artifact@v4
        with:
          name: golden-hash
          path: app/build/outputs/security/