name: Build & Fortify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: >
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.22.1

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libzip-dev

      - name: Cache prebuilt native libs
        id: cache-prebuilt
        uses: actions/cache@v4
        with:
          path: prebuilt
          key: ${{ runner.os }}-prebuilt-ndk29-openssl3-libzip1.10-v9

      - name: Build OpenSSL & libzip for Android
        if: steps.cache-prebuilt.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: |
          set -e
          mkdir -p prebuilt

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -d "$NDK_BIN" ]; then
            echo "NDK toolchain not found at $NDK_BIN"
            find "$ANDROID_NDK_HOME" -maxdepth 3 -type d | head -20
            exit 1
          fi

          echo ">>> NDK bin directory contents:"
          ls -1 "$NDK_BIN" | grep -E '^(aarch64|armv7a|llvm)' | head -30

          # ============================================================
          # 自动探测实际文件名（不硬编码 API 级别）
          # ============================================================
          AARCH64_CLANG=$(ls -1 "$NDK_BIN" | grep -E '^aarch64-linux-android[0-9]+-clang$' | sort | head -1)
          AARCH64_CLANGXX=$(ls -1 "$NDK_BIN" | grep -E '^aarch64-linux-android[0-9]+-clang\+\+$' | sort | head -1)
          ARM_CLANG=$(ls -1 "$NDK_BIN" | grep -E '^armv7a-linux-androideabi[0-9]+-clang$' | sort | head -1)
          ARM_CLANGXX=$(ls -1 "$NDK_BIN" | grep -E '^armv7a-linux-androideabi[0-9]+-clang\+\+$' | sort | head -1)

          if [ -z "$AARCH64_CLANG" ] || [ -z "$AARCH64_CLANGXX" ]; then
            echo "Failed to find aarch64 clang in NDK"
            ls -la "$NDK_BIN"
            exit 1
          fi
          if [ -z "$ARM_CLANG" ] || [ -z "$ARM_CLANGXX" ]; then
            echo "Failed to find armv7 clang in NDK"
            ls -la "$NDK_BIN"
            exit 1
          fi

          echo ">>> Found compilers:"
          echo "  arm64:  $AARCH64_CLANG / $AARCH64_CLANGXX"
          echo "  armv7:  $ARM_CLANG / $ARM_CLANGXX"

          # ============================================================
          # 暴力根治：在 NDK bin 目录内创建无 API 后缀的符号链接
          # OpenSSL Configure 会优先扫描 ANDROID_NDK_HOME 下的 bin，
          # NDK r29 只有带 API 级别的 clang，Configure 找不到就报错。
          # ============================================================
          echo ">>> Creating symlinks inside NDK bin for OpenSSL compatibility"
          cd "$NDK_BIN"

          # aarch64
          ln -sfn "$AARCH64_CLANG"  aarch64-linux-android-clang
          ln -sfn "$AARCH64_CLANGXX" aarch64-linux-android-clang++
          ln -sfn "$AARCH64_CLANG"  aarch64-linux-android-gcc
          ln -sfn "$AARCH64_CLANGXX" aarch64-linux-android-g++
          ln -sfn llvm-ar            aarch64-linux-android-ar
          ln -sfn llvm-nm            aarch64-linux-android-nm
          ln -sfn llvm-ranlib        aarch64-linux-android-ranlib
          ln -sfn llvm-strip         aarch64-linux-android-strip

          # arm
          ln -sfn "$ARM_CLANG"  arm-linux-androideabi-clang
          ln -sfn "$ARM_CLANGXX" arm-linux-androideabi-clang++
          ln -sfn "$ARM_CLANG"  arm-linux-androideabi-gcc
          ln -sfn "$ARM_CLANGXX" arm-linux-androideabi-g++
          ln -sfn llvm-ar       arm-linux-androideabi-ar
          ln -sfn llvm-nm       arm-linux-androideabi-nm
          ln -sfn llvm-ranlib   arm-linux-androideabi-ranlib
          ln -sfn llvm-strip    arm-linux-androideabi-strip

          cd "$GITHUB_WORKSPACE"
          echo ">>> NDK bin after symlinks:"
          ls -la "$NDK_BIN" | grep -E 'android-(gcc|g\+\+|clang|clang\+\+)'

          # ============================================================
          # 双重保险：fake wrapper + PATH
          # ============================================================
          FAKE_BIN="$GITHUB_WORKSPACE/fake-gcc-wrappers"
          mkdir -p "$FAKE_BIN"

          cat > "$FAKE_BIN/aarch64-linux-android-gcc" <<'WRAPPER'
          #!/bin/bash
          exec "${NDK_BIN}/${AARCH64_CLANG}" "$@"
          WRAPPER
          cat > "$FAKE_BIN/aarch64-linux-android-g++" <<'WRAPPER'
          #!/bin/bash
          exec "${NDK_BIN}/${AARCH64_CLANGXX}" "$@"
          WRAPPER
          cat > "$FAKE_BIN/arm-linux-androideabi-gcc" <<'WRAPPER'
          #!/bin/bash
          exec "${NDK_BIN}/${ARM_CLANG}" "$@"
          WRAPPER
          cat > "$FAKE_BIN/arm-linux-androideabi-g++" <<'WRAPPER'
          #!/bin/bash
          exec "${NDK_BIN}/${ARM_CLANGXX}" "$@"
          WRAPPER

          chmod +x "$FAKE_BIN"/*
          export PATH="$FAKE_BIN:$NDK_BIN:$PATH"

          # ============================================================
          # 三重保险：CC / CXX 环境变量
          # ============================================================
          export CROSS_COMPILE=""
          export CC="$NDK_BIN/aarch64-linux-android-clang"
          export CXX="$NDK_BIN/aarch64-linux-android-clang++"
          export AR="$NDK_BIN/llvm-ar"
          export RANLIB="$NDK_BIN/llvm-ranlib"

          cd "$GITHUB_WORKSPACE"

          # ============================================================
          # 编译 OpenSSL 3.0.13
          # ============================================================
          wget -q https://www.openssl.org/source/openssl-3.0.13.tar.gz
          tar xzf openssl-3.0.13.tar.gz
          cd openssl-3.0.13

          # arm64-v8a
          echo ">>> Configuring OpenSSL for arm64-v8a"
          ./Configure android-arm64 \
            -D__ANDROID_API__=28 \
            --prefix="$GITHUB_WORKSPACE/prebuilt/openssl/arm64-v8a" \
            --openssldir="$GITHUB_WORKSPACE/prebuilt/openssl/arm64-v8a" \
            no-shared no-tests
          echo ">>> Building OpenSSL for arm64-v8a"
          make -j$(nproc)
          echo ">>> Installing OpenSSL for arm64-v8a"
          make install_sw
          make distclean || true

          # armeabi-v7a
          echo ">>> Configuring OpenSSL for armeabi-v7a"
          export CC="$NDK_BIN/arm-linux-androideabi-clang"
          export CXX="$NDK_BIN/arm-linux-androideabi-clang++"
          ./Configure android-arm \
            -D__ANDROID_API__=28 \
            --prefix="$GITHUB_WORKSPACE/prebuilt/openssl/armeabi-v7a" \
            --openssldir="$GITHUB_WORKSPACE/prebuilt/openssl/armeabi-v7a" \
            no-shared no-tests
          echo ">>> Building OpenSSL for armeabi-v7a"
          make -j$(nproc)
          echo ">>> Installing OpenSSL for armeabi-v7a"
          make install_sw

          cd "$GITHUB_WORKSPACE"

          # ============================================================
          # 编译 libzip 1.10.1
          # ============================================================
          wget -q https://libzip.org/download/libzip-1.10.1.tar.xz
          tar xf libzip-1.10.1.tar.xz
          cd libzip-1.10.1

          for ABI in arm64-v8a armeabi-v7a; do
            BUILD_DIR="build-$ABI"
            INSTALL_DIR="$GITHUB_WORKSPACE/prebuilt/libzip/$ABI"
            OPENSSL_DIR="$GITHUB_WORKSPACE/prebuilt/openssl/$ABI"

            echo ">>> Configuring libzip for $ABI"
            cmake -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_static \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_OPENSSL=ON \
              -DOPENSSL_ROOT_DIR="$OPENSSL_DIR" \
              -DOPENSSL_INCLUDE_DIR="$OPENSSL_DIR/include" \
              -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_DIR/lib/libcrypto.a" \
              -DOPENSSL_SSL_LIBRARY="$OPENSSL_DIR/lib/libssl.a" \
              -DENABLE_BZIP2=OFF \
              -DENABLE_LZMA=OFF \
              -DENABLE_ZSTD=OFF

            echo ">>> Building libzip for $ABI"
            cmake --build "$BUILD_DIR" --config Release -j$(nproc)
            echo ">>> Installing libzip for $ABI"
            cmake --install "$BUILD_DIR"
          done

          cd "$GITHUB_WORKSPACE"
          echo ">>> All prebuilt artifacts:"
          find prebuilt -type f | sort

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          OPENSSL_BASE_DIR: ${{ github.workspace }}/prebuilt/openssl
          LIBZIP_BASE_DIR: ${{ github.workspace }}/prebuilt/libzip

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fortified-apk
          path: app/build/outputs/apk/release/*-signed.apk

      - name: Upload Golden Hash
        uses: actions/upload-artifact@v4
        with:
          name: golden-hash
          path: app/build/outputs/security/
